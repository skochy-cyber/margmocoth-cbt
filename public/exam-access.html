<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARGMOCOTH CBT">
<meta name="theme-color" content="#2e3192">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Access — MARGMOCOTH CBT</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

:root {
  --brand:      #2e3192;
  --brand-deep: #4448b8;
  --brand-dim:  rgba(46,49,146,.10);
  --brand-glow: rgba(46,49,146,.22);
  --bg:         #f0f2f5;
  --surface:    #ffffff;
  --border:     rgba(0,0,0,.08);
  --border-med: rgba(0,0,0,.13);
  --text:       #0f1230;
  --text-2:     #6b6560;
  --text-3:     #a8a29e;
  --success:    #16a34a;
  --danger:     #dc2626;
  --warning:    #d97706;
  --font:       'Plus Jakarta Sans', system-ui, sans-serif;
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  22px;
  --r-pill: 999px;
  --shadow: 0 2px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06);
}

body {
  font-family: var(--font);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
}

/* ── TOPBAR ── */
.topbar {
  background: #0f1230;
  height: 60px;
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  flex-shrink: 0;
}
.topbar-logo { display: flex; align-items: center; gap: 10px; }
.topbar-logo img {
  width: 34px; height: 34px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,.12); object-fit: cover;
}
.topbar-brand {
  font-size: 14px; font-weight: 800; color: #fff;
  line-height: 1.2; letter-spacing: -.3px;
}
.topbar-brand span {
  font-size: 10px; font-weight: 500; color: rgba(255,255,255,.45);
  display: block; letter-spacing: .2px;
}
.topbar-back {
  background: rgba(255,255,255,.1);
  border: 1.5px solid rgba(255,255,255,.15);
  color: #fff; border-radius: var(--r-sm);
  padding: 7px 13px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: var(--font);
  text-decoration: none; display: inline-flex; align-items: center;
  transition: background .2s;
}
.topbar-back:hover { background: rgba(255,255,255,.18); }

/* ── PAGE ── */
.page {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px 48px;
}

/* ── CARD ── */
.card {
  width: 100%; max-width: 440px;
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(0,0,0,.06);
  overflow: hidden;
  animation: riseIn .45s cubic-bezier(.22,1,.36,1) both;
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: none; }
}

/* Top accent bar */
.card-accent {
  height: 3px;
  background: linear-gradient(90deg, var(--brand-deep), var(--brand), #d8232a);
}

.card-header {
  padding: 28px 28px 22px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.icon-wrap {
  width: 60px; height: 60px;
  margin: 0 auto 14px;
  background: var(--brand-dim);
  border: 1.5px solid rgba(46,49,146,.2);
  border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: center;
  color: var(--brand);
}

.card-title {
  font-size: 19px; font-weight: 800;
  color: var(--text); letter-spacing: -.3px;
  margin-bottom: 5px;
}
.card-sub {
  font-size: 13px; color: var(--text-2); line-height: 1.5;
}

/* ── STUDENT BAR ── */
.student-bar {
  margin: 0 20px 0;
  background: rgba(22,163,74,.06);
  border: 1px solid rgba(22,163,74,.18);
  border-radius: var(--r-md);
  padding: 12px 14px;
  display: none; align-items: center; gap: 10px;
  margin: 20px 28px 0;
}
.student-bar.show { display: flex; }
.student-avatar {
  width: 36px; height: 36px;
  background: rgba(22,163,74,.1);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--success);
}
.student-info { flex: 1; min-width: 0; }
.student-name {
  font-size: 13px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.student-meta {
  font-size: 11px; color: var(--text-2);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.online-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  flex-shrink: 0;
}

/* ── CARD BODY ── */
.card-body { padding: 22px 28px 28px; }

/* Alert */
.alert {
  border-radius: var(--r-md);
  padding: 11px 14px;
  font-size: 13px; font-weight: 600;
  margin-bottom: 16px;
  display: flex; align-items: flex-start; gap: 8px;
  line-height: 1.5;
  border: 1px solid transparent;
  animation: slideIn .18s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
.alert-danger  { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
.alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.alert-info    { background: #fff8f3; border-color: #fed7aa; color: #9a3412; }

/* Input */
.input-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px;
  color: var(--text-2); margin-bottom: 8px;
  display: block;
}
.code-input-wrap { position: relative; margin-bottom: 16px; }
.code-input {
  width: 100%;
  padding: 15px 20px;
  background: #f7f7f8;
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-size: 22px; font-weight: 800;
  text-align: center;
  letter-spacing: 8px;
  text-transform: uppercase;
  outline: none;
  transition: border .2s, box-shadow .2s, background .2s;
  caret-color: var(--brand);
}
.code-input::placeholder {
  color: var(--text-3); letter-spacing: 4px;
  font-size: 15px; font-weight: 600;
}
.code-input:focus {
  border-color: var(--brand);
  background: #fff;
  box-shadow: 0 0 0 3px var(--brand-dim);
}

/* Exam preview */
.exam-preview {
  display: none;
  background: #fafaf9;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 16px;
  animation: riseIn .2s ease;
}
.exam-preview.show { display: block; }
.exam-preview-head {
  padding: 10px 14px;
  background: var(--brand-dim);
  border-bottom: 1px solid rgba(46,49,146,.12);
  font-size: 11px; font-weight: 700;
  color: var(--brand-deep);
  text-transform: uppercase; letter-spacing: .6px;
}
.exam-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.exam-row:last-child { border-bottom: none; }
.exam-row-label { color: var(--text-2); font-weight: 600; }
.exam-row-val   { font-weight: 700; color: var(--text); text-align: right; max-width: 60%; }

/* Buttons */
.btn-verify {
  width: 100%; padding: 14px;
  background: var(--brand);
  border: none; border-radius: var(--r-md);
  color: #fff; font-family: var(--font);
  font-size: 15px; font-weight: 800;
  cursor: pointer; margin-bottom: 10px;
  transition: background .2s, transform .1s, box-shadow .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 16px var(--brand-glow);
  letter-spacing: -.1px;
}
.btn-verify:hover   { background: var(--brand-deep); box-shadow: 0 6px 22px var(--brand-glow); }
.btn-verify:active  { transform: scale(.98); }
.btn-verify:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.btn-start {
  width: 100%; padding: 14px;
  background: var(--success);
  border: none; border-radius: var(--r-md);
  color: #fff; font-family: var(--font);
  font-size: 15px; font-weight: 800;
  cursor: pointer; margin-bottom: 10px;
  transition: background .2s, transform .1s;
  display: none; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(22,163,74,.25);
  letter-spacing: -.1px;
  animation: riseIn .2s ease;
}
.btn-start.show { display: flex; }
.btn-start:hover  { background: #15803d; }
.btn-start:active { transform: scale(.98); }

/* Footer links */
.footer-links {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-top: 4px;
}
.footer-link {
  color: var(--text-3); font-size: 13px; font-weight: 600;
  text-decoration: none; background: none; border: none;
  cursor: pointer; transition: color .2s; font-family: var(--font);
}
.footer-link:hover { color: var(--brand); }
.footer-sep { color: var(--border); font-size: 12px; }

/* Face capture / pay now links */
.face-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(22,163,74,.1);
  border: 1px solid rgba(22,163,74,.25);
  color: #166534; padding: 8px 13px;
  border-radius: var(--r-sm); font-size: 13px; font-weight: 700;
  text-decoration: none; margin-top: 6px;
  transition: background .2s;
}
.face-link:hover { background: rgba(22,163,74,.18); }

/* Spinner */
.spinner {
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .55s linear infinite;
  display: inline-block; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <img src="school-logo.png" alt="MARGMOCOTH CBT">
    <div class="topbar-brand">
      MARGMOCOTH CBT
      <span>Exam Portal</span>
    </div>
  </div>
  <a href="dashboard.html" class="topbar-back">← Dashboard</a>
</div>

<div class="page">
  <div class="card">
    <div class="card-accent"></div>

    <div class="card-header">
      <div class="icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </div>
      <div class="card-title">Exam Access</div>
      <div class="card-sub" id="cardSub">Checking exam details…</div>
    </div>

    <div class="student-bar" id="studentBar">
      <div class="student-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="student-info">
        <div class="student-name" id="studentName"></div>
        <div class="student-meta" id="studentMeta"></div>
      </div>
      <div class="online-dot"></div>
    </div>

    <div class="card-body">
      <div id="alertBox"></div>

      <div class="exam-preview" id="examPreview">
        <div class="exam-preview-head">Exam Details</div>
        <div id="examDetails"></div>
      </div>

      <button class="btn-start" id="startBtn" onclick="startExam()">
        Start Exam Now
      </button>

      <div class="footer-links">
        <button onclick="logout()" class="footer-link">Logout</button>
      </div>
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
let examData = null;
let aiMonitoringEnabled = false;
const student = JSON.parse(localStorage.getItem('mcht_student') || 'null');
const urlParams = new URLSearchParams(window.location.search);
const examId    = urlParams.get('exam_id');

if (!student) {
  window.location.href = 'login.html';
} else {
  const bar = document.getElementById('studentBar');
  bar.classList.add('show');
  document.getElementById('studentName').textContent = student.name;
  const arm   = student.department || '';
  const cls   = student.level || '';
  const parts = [cls, arm].filter(Boolean).join(' · ');
  document.getElementById('studentMeta').textContent = parts;
  checkAIMonitoring();
  checkExam();
}

function logout() {
  localStorage.removeItem('mcht_student');
  localStorage.removeItem('mcht_login_at');
  sessionStorage.clear();
  window.location.href = 'login.html';
}

async function checkAIMonitoring() {
  try {
    const settings = await fetch('/api/settings/exam-engine').then(r => r.json());
    sessionStorage.setItem('examSettings', JSON.stringify(settings));
  } catch(e) {}
  aiMonitoringEnabled = false; // AI face/violation monitoring removed in MARGMOCOTH CBT
}

// Access codes removed — the exam is validated directly by ID (passed from the
// dashboard) instead of requiring the student to type in a code.
async function checkExam() {
  const alertBox = document.getElementById('alertBox');
  const cardSub  = document.getElementById('cardSub');
  alertBox.innerHTML = '';

  if (!examId) {
    cardSub.textContent = 'Exam not found';
    alertBox.innerHTML = '<div class="alert alert-danger">No exam was selected. Please go back to your dashboard and pick an exam.</div>';
    return;
  }

  try {
    const res  = await fetch('/api/student/exam-start-check', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ exam_id: examId, student_id: student.id })
    });
    const data = await res.json();

    if (data.success) {
      examData    = data.exam;
      examData.id = examData.id
        ? examData.id.toString()
        : (examData._id ? examData._id.toString() : examId);

      sessionStorage.setItem('currentExam', JSON.stringify(examData));

      cardSub.textContent = 'Review the details below and start when ready';
      document.getElementById('examDetails').innerHTML = `
        <div class="exam-row"><span class="exam-row-label">Exam Title</span><span class="exam-row-val">${examData.title}</span></div>
        <div class="exam-row"><span class="exam-row-label">Course</span><span class="exam-row-val">${examData.course_name || '—'}</span></div>
        <div class="exam-row"><span class="exam-row-label">Duration</span><span class="exam-row-val">${examData.duration} minutes</span></div>
        <div class="exam-row"><span class="exam-row-label">Questions</span><span class="exam-row-val">${examData.question_count}</span></div>
      `;
      document.getElementById('examPreview').classList.add('show');
      document.getElementById('startBtn').classList.add('show');
    } else {
      cardSub.textContent = 'Unable to start exam';
      if (data.face_photo_missing) {
        alertBox.innerHTML = `
          <div class="alert alert-danger" style="flex-direction:column;align-items:flex-start;gap:10px;">
            <span>${data.message}</span>
            <a href="student-capture.html" class="face-link">Go to Face Capture →</a>
          </div>`;
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
      }
    }
  } catch(e) {
    cardSub.textContent = 'Unable to start exam';
    alertBox.innerHTML = '<div class="alert alert-danger">Server error. Please try again.</div>';
  }
}

function startExam() {
  if (!examData || !examData.id) {
    alert('Exam data missing. Please go back to the dashboard and try again.');
    return;
  }
  // Clear any stale submission data from a previous attempt so the
  // guardAlreadySubmitted check in exam-page.html does not redirect
  // the student back to results before the retake can begin.
  const examKey = examData.id ? examData.id.toString() : null;
  sessionStorage.removeItem('examResult');
  if (examKey) sessionStorage.removeItem('examSessionSubmitted_' + examKey);

  sessionStorage.setItem('student', JSON.stringify(student));
  sessionStorage.setItem('currentExam', JSON.stringify(examData));
  window.location.href = aiMonitoringEnabled ? 'face-capture.html' : 'exam-page.html';
}
</script>
<script src="/js/pending-submit.js"></script>
</body>
</html>
