<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARGMOCOTH CBT">
<meta name="theme-color" content="#2e3192">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Captures – MARGMOCOTH CBT</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
.content { font-family: 'DM Sans', sans-serif; }

.captures-hero {
  background: linear-gradient(135deg, #0f1230 0%, #14163f 50%, #1f2170 100%);
  border-radius: 20px; padding: 32px 28px; margin-bottom: 28px;
  position: relative; overflow: hidden;
}
.captures-hero::before {
  content: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>'; position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
  font-size: 96px; opacity: .08; pointer-events: none; line-height: 1;
}
.captures-hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px; padding: 4px 14px; font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.9);
  margin-bottom: 14px;
}
.captures-hero-tag span { width: 6px; height: 6px; background:#9ea2f0; border-radius:50%; }
.captures-hero h1 { font-size: 26px; font-weight: 700; color: #fff; margin: 0 0 6px; letter-spacing: -0.5px; }
.captures-hero p  { font-size: 14px; color: rgba(255,255,255,.75); margin: 0; }

.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;
}
@media (max-width: 600px) { .stats-row { grid-template-columns: 1fr 1fr; } }
.stat-card {
  background: #fff; border-radius: 16px; border: 1px solid #e6e8f3;
  padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.stat-num { font-size: 28px; font-weight: 800; color: #1b1e45; }
.stat-label { font-size: 12px; color: #8e92b3; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }

.toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.search-input {
  flex: 1; min-width: 200px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1b1e45;
  background: #fff; border: 1.5px solid #e6e8f3; border-radius: 10px;
  padding: 10px 16px; transition: border-color .2s;
}
.search-input:focus { outline: none; border-color: #1f2170; box-shadow: 0 0 0 3px rgba(30,64,175,.1); }
.btn-refresh {
  background: #1f2170; color: #fff; border: none; border-radius: 10px;
  padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s;
}
.btn-refresh:hover { background: #14163f; }
.btn-danger-all {
  background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; border-radius: 10px;
  padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s;
}
.btn-danger-all:hover { background: #fca5a5; }

.captures-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px; margin-bottom: 32px;
}
.capture-card {
  background: #fff; border-radius: 16px; border: 1px solid #e6e8f3; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: transform .2s, box-shadow .2s;
  position: relative;
}
.capture-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.capture-img-wrap {
  aspect-ratio: 1; background: #f1f2fa; overflow: hidden; position: relative; cursor: pointer;
}
.capture-img-wrap img {
  width: 100%; height: 100%; object-fit: cover; transition: transform .3s;
}
.capture-card:hover .capture-img-wrap img { transform: scale(1.04); }
.capture-info { padding: 12px 14px 14px; }
.capture-name {
  font-size: 14px; font-weight: 700; color: #1b1e45;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
}
.capture-matric { font-size: 11px; color: #5b5f80; font-family: monospace; margin-bottom: 4px; }
.capture-exam {
  font-size: 12px; color: #8e92b3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px;
}
.capture-time { font-size: 11px; color: #cdd0e6; }
.capture-actions {
  display: flex; gap: 6px; margin-top: 10px;
}
.btn-view-capture {
  flex: 1; background: #f0f1ff; color: #1f2170; border: none; border-radius: 8px;
  padding: 7px 0; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.btn-view-capture:hover { background: #e0e2ff; }
.btn-delete-capture {
  background: #fee2e2; color: #dc2626; border: none; border-radius: 8px;
  padding: 7px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.btn-delete-capture:hover { background: #fca5a5; }

.empty-state {
  text-align: center; padding: 60px 24px;
  background: #fff; border-radius: 16px; border: 1.5px dashed #e6e8f3;
}
.empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; font-weight: 700; color: #1b1e45; margin-bottom: 8px; }
.empty-state p  { font-size: 14px; color: #8e92b3; }
.loading-state { text-align: center; padding: 48px; color: #8e92b3; font-size: 14px; }

/* Lightbox */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 99999;
  background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.lightbox-overlay.show { display: flex; }
.lightbox-inner {
  max-width: 600px; width: 100%; background: #fff; border-radius: 20px; overflow: hidden;
  animation: lbIn .25s ease;
}
@keyframes lbIn { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:none; } }
.lightbox-img { width: 100%; display: block; }
.lightbox-details {
  padding: 20px 24px; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 16px;
}
.lightbox-info h3 { font-size: 16px; font-weight: 700; color: #1b1e45; margin-bottom: 4px; }
.lightbox-info p  { font-size: 13px; color: #5b5f80; margin: 0; }
.lightbox-close {
  background: #fee2e2; color: #dc2626; border: none; border-radius: 8px;
  padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: all .15s;
}
.lightbox-close:hover { background: #fca5a5; }
</style>
</head>
<body>
<div class="admin-layout">
  <div id="sidebarContainer"></div>
  <div class="admin-main">
    <div id="topbarContainer"></div>
    <div class="content">

      <div id="alertBox"></div>

      <div class="captures-hero">
        <div class="captures-hero-tag"><span></span>AI Proctoring</div>
        <h1>Student Face Captures</h1>
        <p>View, review and delete identity photos captured during exam face verification.</p>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">Total Captures</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statToday">—</div>
          <div class="stat-label">Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statStudents">—</div>
          <div class="stat-label">Unique Students</div>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input"
          placeholder="Search by name or matric..." oninput="filterCaptures()">
        <button class="btn-refresh" onclick="loadCaptures()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Refresh</button>
        <button class="btn-danger-all" style="background:#b45309;color:#fff;border-color:#92400e;" onclick="cleanDuplicateCaptures()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3l14 14M5 17l4-4m4-4l4-4M3 21l4-4"/></svg> Clean Duplicates</button>
        <button class="btn-danger-all" onclick="deleteAllCaptures()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg> Delete All</button>
      </div>

      <div id="capturesContainer">
        <div class="loading-state"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> Loading face captures...</div>
      </div>

    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-inner">
    <img id="lbImg" class="lightbox-img" alt="Face Capture">
    <div class="lightbox-details">
      <div class="lightbox-info">
        <h3 id="lbName">—</h3>
        <p id="lbDetails">—</p>
      </div>
      <button class="lightbox-close" onclick="hideLightbox()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg> Close</button>
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
document.getElementById('sidebarContainer').innerHTML = getSidebarHTML('admin-capturing.html');
document.getElementById('topbarContainer').innerHTML  = getTopbarHTML('Face Captures');
checkAdmin();
requirePermission('view_captures');

let allCaptures = [];

function formatDateTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('en-NG', {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

async function loadCaptures() {
  document.getElementById('capturesContainer').innerHTML = '<div class="loading-state"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> Loading face captures...</div>';
  try {
    const admin = JSON.parse(sessionStorage.getItem('admin') || '{}');
    const url   = admin.role === 'lecturer'
      ? `/api/admin/face-captures?lecturer_id=${admin.id}`
      : '/api/admin/face-captures';
    allCaptures = await apiGet(url);
    updateStats();
    renderCaptures(allCaptures);
  } catch(e) {
    document.getElementById('capturesContainer').innerHTML = '<div class="loading-state"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;color:#dc2626;"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Failed to load captures.</div>';
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = allCaptures.length;
  const today     = new Date().toDateString();
  const todayCount= allCaptures.filter(c => new Date(c.captured_at).toDateString() === today).length;
  document.getElementById('statToday').textContent    = todayCount;
  document.getElementById('statStudents').textContent = new Set(allCaptures.map(c => c.matric)).size;
}

function filterCaptures() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { renderCaptures(allCaptures); return; }
  renderCaptures(allCaptures.filter(c =>
    (c.student_name || '').toLowerCase().includes(q) ||
    (c.matric || '').toLowerCase().includes(q)
  ));
}

function renderCaptures(list) {
  const container = document.getElementById('capturesContainer');
  if (!list.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
        <h3>No Face Captures Yet</h3>
        <p>Student face captures will appear here once AI monitoring is enabled and students complete verification.</p>
      </div>`;
    return;
  }
  container.innerHTML = `<div class="captures-grid">${list.map(c => `
    <div class="capture-card" id="card-${c.id}">
      <div class="capture-img-wrap" onclick="openLightbox('${esc(c.cloudinary_url)}','${esc(c.student_name)}','${esc(c.matric)}','${esc(c.exam_title)}','${formatDateTime(c.captured_at)}')">
        <img src="${c.cloudinary_url || ''}" alt="${esc(c.student_name)}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23f1f5f9\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'48\\'><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></text></svg>'">
      </div>
      <div class="capture-info">
        <div class="capture-name">${esc(c.student_name)}</div>
        <div class="capture-matric">${esc(c.matric)}</div>
        <div class="capture-exam">${esc(c.exam_title)}</div>
        <div class="capture-time">${formatDateTime(c.captured_at)}</div>
        <div class="capture-actions">
          <button class="btn-view-capture"
            onclick="openLightbox('${esc(c.cloudinary_url)}','${esc(c.student_name)}','${esc(c.matric)}','${esc(c.exam_title)}','${formatDateTime(c.captured_at)}')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg> View
          </button>
          <button class="btn-delete-capture" onclick="deleteCapture('${c.id}', event)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}

function esc(s) {
  return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function deleteCapture(id, event) {
  event.stopPropagation();
  if (!confirmDelete('Delete this face capture? This cannot be undone.')) return;
  try {
    const r = await apiDelete(`/api/admin/face-captures/${id}`);
    if (r.success) {
      allCaptures = allCaptures.filter(c => c.id !== id);
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
      updateStats();
      showAlert('Face capture deleted.', 'success');
    } else {
      showAlert(r.message || 'Delete failed.', 'danger');
    }
  } catch(e) {
    showAlert('Server error while deleting.', 'danger');
  }
}

// <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="display:inline-block;vertical-align:middle;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> NEW: Remove duplicate face captures — keeps only the best (verified > flagged > latest)
// per student+exam. Cleans up the pile-up caused by page retries and double submissions.
async function cleanDuplicateCaptures() {
  if (!confirmDelete('Remove duplicate face captures?\n\nThis keeps ONE capture per student per exam (verified ones are prioritised) and deletes the rest.')) return;
  try {
    const r = await apiDelete('/api/admin/face-captures/duplicates');
    if (r.success) {
      showAlert(`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;color:#16a34a;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Cleaned ${r.deleted} duplicate capture(s). Reloading…`, 'success');
      setTimeout(() => loadCaptures(), 1500);
    } else {
      showAlert(r.message || 'Clean failed.', 'danger');
    }
  } catch(e) {
    showAlert('Server error cleaning duplicates.', 'danger');
  }
}

async function deleteAllCaptures() {
  if (!confirmDelete('Delete ALL face captures? This action is irreversible.')) return;
  try {
    const r = await apiDelete('/api/admin/face-captures');
    if (r.success) {
      allCaptures = [];
      renderCaptures([]);
      updateStats();
      showAlert(`All captures deleted (${r.deleted} removed).`, 'success');
    } else {
      showAlert(r.message || 'Delete failed.', 'danger');
    }
  } catch(e) {
    showAlert('Server error.', 'danger');
  }
}

function openLightbox(url, name, matric, exam, time) {
  document.getElementById('lbImg').src          = url;
  document.getElementById('lbName').textContent = name;
  document.getElementById('lbDetails').textContent = `${matric} · ${exam} · ${time}`;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox')) hideLightbox();
}

function hideLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') hideLightbox(); });
loadCaptures();
</script>
<script src="js/ai-assistant.js" defer></script>
<script src="/pwa.js"></script>
</body>
</html>
