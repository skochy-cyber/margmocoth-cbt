<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARGMOCOTH CBT">
<meta name="theme-color" content="#2e3192">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profiles – MARGMOCOTH CBT</title>
<link rel="stylesheet" href="css/style.css">
<!-- SheetJS for Excel export -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- jsPDF + AutoTable for PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>

/* ── FILTER BAR ── */
.filter-bar {
 display: flex; gap: 10px; flex-wrap: wrap;
 align-items: center; margin-bottom: 20px;
}
.filter-bar select, .filter-bar input {
 padding: 9px 12px; border: 1.5px solid var(--border);
 border-radius: var(--r-sm); font-family: 'DM Sans', sans-serif;
 font-size: 13px; background: var(--surface); color: var(--text);
 flex: 1; min-width: 130px;
}
.filter-bar select:focus, .filter-bar input:focus {
 outline: none; border-color: var(--brand-500);
}

/* ── STATS ROW ── */
.stats-row {
 display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
 margin-bottom: 20px;
}
.stat-card {
 background: var(--surface); border: 1px solid var(--border);
 border-radius: var(--r-md); padding: 14px 16px; text-align: center;
}
.stat-val  { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
.stat-val.green  { color: #16a34a; }
.stat-val.orange { color: #d97706; }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text-2); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

/* ── GROUP HEADER ── */
.group-header {
 display: flex; align-items: center; justify-content: space-between;
 background: linear-gradient(135deg, #4448b8, #2e3192);
 color: #fff; border-radius: var(--r-md) var(--r-md) 0 0;
 padding: 14px 18px; margin-top: 24px;
 font-size: 14px; font-weight: 800; letter-spacing: .3px;
}
.group-header:first-of-type { margin-top: 0; }
.group-count {
 background: rgba(255,255,255,.2); border-radius: 999px;
 padding: 3px 10px; font-size: 12px; font-weight: 700;
 display: flex; align-items: center; gap: 6px;
}
.group-count .cap-count { color: #86efac; }

/* ── STUDENT GRID ── */
.student-grid {
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
 gap: 12px;
 background: var(--surface); border: 1px solid var(--border);
 border-top: none; border-radius: 0 0 var(--r-md) var(--r-md);
 padding: 14px;
 margin-bottom: 4px;
}

/* ── STUDENT CARD ── */
.student-card {
 background: var(--surface-2); border: 1.5px solid var(--border);
 border-radius: var(--r-md); padding: 14px 10px;
 display: flex; flex-direction: column; align-items: center;
 text-align: center; gap: 8px; position: relative;
 transition: box-shadow .18s, border-color .18s;
}
.student-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); border-color: var(--brand-300); }
.student-card.no-photo { border-style: dashed; opacity: .75; }

/* Photo or placeholder */
.s-photo {
 width: 64px; height: 64px; border-radius: 50%;
 object-fit: cover; border: 3px solid var(--brand-400);
 box-shadow: 0 2px 8px rgba(46,49,146,.2);
 display: block;
}
.s-initials {
 width: 64px; height: 64px; border-radius: 50%;
 background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
 border: 3px dashed #818cf8;
 display: flex; align-items: center; justify-content: center;
 font-size: 20px; font-weight: 800; color: #4338ca;
}

/* Status badge */
.s-status {
 position: absolute; top: 8px; right: 8px;
 width: 18px; height: 18px; border-radius: 50%;
 font-size: 10px; display: flex; align-items: center;
 justify-content: center;
}
.s-status.captured { background: #dcfce7; color: #15803d; }
.s-status.pending  { background: #fef9c3; color: #854d0e; }

.s-name  { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
.s-matric { font-size: 10.5px; color: var(--text-2); font-family: monospace; }

/* Action button */
.s-reset-btn {
 font-size: 10px; font-weight: 700; padding: 4px 10px;
 border-radius: 999px; border: none; cursor: pointer;
 background: #fee2e2; color: #dc2626; font-family: 'DM Sans', sans-serif;
 transition: background .15s; display: none;
}
.s-reset-btn:hover { background: #fecaca; }
.student-card.captured .s-reset-btn { display: block; }

/* Empty state inside group */
.group-empty {
 background: var(--surface); border: 1px solid var(--border);
 border-top: none; border-radius: 0 0 var(--r-md) var(--r-md);
 padding: 24px; text-align: center; color: var(--text-2);
 font-size: 13px; margin-bottom: 4px;
}

/* Capture toggle card */
.capture-status-card {
 background: var(--surface); border: 1.5px solid var(--border);
 border-radius: var(--r-md); padding: 16px 18px;
 display: flex; align-items: center; justify-content: space-between;
 gap: 12px; margin-bottom: 20px;
}
.capture-status-info strong { font-size: 14px; font-weight: 700; color: var(--text); display: block; }
.capture-status-info span  { font-size: 12px; color: var(--text-2); }
.toggle-wrap {
 position: relative; width: 46px; height: 26px; flex-shrink: 0; cursor: pointer;
}
.toggle-track {
 position: absolute; inset: 0; background: var(--n-300);
 border-radius: 999px; transition: background .2s;
}
.toggle-track.on  { background: var(--brand-500); }
.toggle-track.off { background: #dc2626; }
.toggle-knob {
 position: absolute; width: 20px; height: 20px; border-radius: 50%;
 background: #fff; top: 3px; left: 3px;
 transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.toggle-knob.on { transform: translateX(20px); }

/* ── EXPORT BUTTONS ── */
.export-bar {
 display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
}
.export-bar-label {
 font-size: 12px; font-weight: 700; color: var(--text-2);
 text-transform: uppercase; letter-spacing: .5px; margin-right: 4px;
}
.export-btn {
 display: inline-flex; align-items: center; gap: 6px;
 padding: 8px 14px; border: none; border-radius: var(--r-sm);
 font-size: 12px; font-weight: 700; cursor: pointer;
 font-family: 'DM Sans', sans-serif; transition: opacity .15s;
 white-space: nowrap;
}
.export-btn:hover { opacity: .85; }
.export-btn:disabled { opacity: .5; cursor: not-allowed; }
.export-btn-excel { background: #166534; color: #fff; }
.export-btn-pdf  { background: #9f1239; color: #fff; }
@keyframes slideUp {
 from { transform: translateY(100%); opacity: 0; }
 to  { transform: translateY(0);  opacity: 1; }
}
.dept-status-btn {
 flex: 1; padding: 9px 6px; border: 1.5px solid #e6e8f3;
 border-radius: 10px; font-size: 12px; font-weight: 700;
 color: #5b5f80; background: #f6f7fc; cursor: pointer;
 font-family: inherit; transition: all .15s;
}
.dept-status-btn.active {
 background: #4448b8; color: #fff; border-color: #4448b8;
}
.export-btn-dept { background: #7c3aed; color: #fff; }

@media (max-width: 560px) {
 .student-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
 .stats-row  { grid-template-columns: 1fr 1fr 1fr; }
 .stat-val  { font-size: 22px; }
}

/* ── Custom Confirm Dialog ──────────────────────────────────── */
.confirm-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.50); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.confirm-overlay.show { opacity: 1; pointer-events: all; }
.confirm-box {
  background: var(--surface, #fff);
  border-radius: 20px;
  padding: 28px 24px 22px;
  width: 100%; max-width: 360px;
  box-shadow: 0 24px 64px rgba(0,0,0,.22);
  transform: scale(.94) translateY(12px);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  text-align: center;
}
.confirm-overlay.show .confirm-box { transform: scale(1) translateY(0); }
.confirm-icon-wrap {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
}
.confirm-icon-wrap.warn   { background: #fff7ed; color: #2e3192; }
.confirm-icon-wrap.danger { background: #fef2f2; color: #dc2626; }
.confirm-icon-wrap.info   { background: #f0f1ff; color: #2e3192; }
.confirm-icon-wrap svg { display: block; }
.confirm-title {
  font-size: 17px; font-weight: 800;
  color: var(--text, #111); margin-bottom: 8px;
}
.confirm-msg {
  font-size: 13px; color: var(--muted, var(--text-2, #666));
  line-height: 1.6; margin-bottom: 24px;
}
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button {
  flex: 1; padding: 11px 0; border-radius: 12px;
  font-size: 14px; font-weight: 700; border: none;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.confirm-actions button:active { transform: scale(.97); }
.confirm-btn-cancel { background: #f1f2fa; color: #1b1e45; }
.confirm-btn-cancel:hover { opacity: .75; }
.confirm-btn-ok        { color: #fff; }
.confirm-btn-ok.warn   { background: #2e3192; }
.confirm-btn-ok.danger { background: #dc2626; }
.confirm-btn-ok.info   { background: #2e3192; }
.confirm-btn-ok:hover  { opacity: .88; }
</style>
</head>
<body>
<div class="admin-layout">
 <div id="sidebarContainer"></div>
 <div class="admin-main">
 <div id="topbarContainer"></div>
 <div class="content">
 <div id="alertBox"></div>

 <!-- Capture Enable/Disable quick toggle -->
 <div class="capture-status-card">
 <div class="capture-status-info">
 <strong>Student Face Capture</strong>
 <span id="captureStatusLabel">Loading…</span>
 </div>
 <div class="toggle-wrap" onclick="toggleCaptureSetting()">
 <div class="toggle-track" id="captureTrack"></div>
 <div class="toggle-knob" id="captureKnob"></div>
 </div>
 </div>

 <!-- Stats -->
 <div class="stats-row">
 <div class="stat-card">

 <div class="stat-label">Total Students</div>
 </div>
 <div class="stat-card">
 <div class="stat-val green" id="statCaptured">—</div>
 <div class="stat-label">Captured</div>
 </div>
 <div class="stat-card">
 <div class="stat-val orange" id="statPending">—</div>

 </div>
 </div>

 <!-- Export Bar -->
 <div class="export-bar">
 <span class="export-bar-label">Export:</span>
 <button class="export-btn export-btn-excel" onclick="exportProfilesExcel()">Excel</button>
 <button class="export-btn export-btn-pdf"  onclick="exportProfilesPDF()">PDF</button>
 <button class="export-btn" style="background:#7c3aed;color:#fff;" onclick="openDeptExportModal()">By Department</button>
 </div>

 <!-- Department Export Modal -->
 <div id="deptExportModal" style="display:none;position:fixed;inset:0;z-index:9000;
 background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;"
 onclick="if(event.target===this)closeDeptExportModal()">
 <div style="background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;
 padding:24px 20px 36px;box-shadow:0 -8px 40px rgba(0,0,0,.18);
 animation:slideUp .25s cubic-bezier(.22,1,.36,1);">
 <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
 <div style="font-size:16px;font-weight:900;color:#1b1e45;">Export by Department</div>

 <!-- Department picker -->
 <div style="margin-bottom:14px;">

 </select>

 </div>

 <!-- Preview count -->
 <div id="deptExportPreview" style="background:#f1f2fa;border-radius:10px;

 </div>

 <!-- Export buttons -->
 <div style="display:flex;gap:10px;">
 <button onclick="runDeptExport('excel')"

 Export Excel
 </button>
 <button onclick="runDeptExport('pdf')"
 style="flex:1;padding:13px;background:#9f1239;color:#fff;border:none;

 Export PDF

 <!-- Filters -->

<script src="js/admin.js"></script>
<script>
document.getElementById('sidebarContainer').innerHTML = getSidebarHTML('student-profiles.html');
document.getElementById('topbarContainer').innerHTML  = getTopbarHTML('Student Profiles');
checkAdmin();
requirePermission('view_captures');

let allStudents  = [];
let captureEnabled = true;

// ── Load data ──────────────────────────────────────────────────
async function loadPage() {
 await Promise.all([loadCaptureStatus(), loadStudents()]);
}

async function loadCaptureStatus() {
 try {
 const res = await fetch('/api/admin/settings', {
 headers: { 'X-Admin-Token': getAdminToken() }
 });
 if (res.status === 401) {
 sessionStorage.removeItem('admin');
 sessionStorage.removeItem('adminToken');
 window.location.href = 'admin-login.html';
 return;
 }
 const data = res.ok ? await res.json() : {};
 captureEnabled = data.student_capture_enabled !== false;
 applyCaptureBadge(captureEnabled);
 } catch(e) { applyCaptureBadge(true); }
}

function applyCaptureBadge(enabled) {
 captureEnabled = enabled;
 const track = document.getElementById('captureTrack');
 const knob  = document.getElementById('captureKnob');
 const label = document.getElementById('captureStatusLabel');
 if (track) { track.className = 'toggle-track ' + (enabled ? 'on' : 'off'); }
 if (knob)  { knob.className  = 'toggle-knob '  + (enabled ? 'on' : '');  }
 if (label) { label.textContent = enabled
 ? 'Students can capture their face photo (one time only)'
 : 'Capture is disabled — students cannot upload'; }
}

async function toggleCaptureSetting() {
 const newVal = !captureEnabled;
 applyCaptureBadge(newVal);
 try {
 await apiPost('/api/admin/settings', { key: 'student_capture_enabled', value: newVal });
 showAlert(` Student face capture <strong>${newVal ? 'enabled' : 'disabled'}</strong>.`, newVal ? 'success' : 'danger');
 } catch(e) {
 applyCaptureBadge(!newVal); // revert
 showAlert(' Failed to save setting.', 'danger');
 }
}

async function loadStudents() {
 const container = document.getElementById('groupsContainer');
 try {
 //  FIX: Use raw fetch so we can check HTTP status before parsing JSON.
 // apiGet() calls res.json() blindly — if the server returns an HTML error
 // page (cold start on Render, session expired, etc.) it throws and the
 // catch block shows the generic "Failed to load" message with no way out.
 const res = await fetch('/api/admin/student-profiles', {
 headers: { 'X-Admin-Token': getAdminToken() }
 });

 if (res.status === 401) {
 // Session expired — redirect to login
 sessionStorage.removeItem('admin');
 sessionStorage.removeItem('adminToken');
 window.location.href = 'admin-login.html';
 return;
 }

 if (!res.ok) {
 throw new Error(`Server error ${res.status}`);
 }

 const contentType = res.headers.get('content-type') || '';
 if (!contentType.includes('application/json')) {
 throw new Error('non_json');
 }

 allStudents = await res.json();
 if (!Array.isArray(allStudents)) allStudents = [];
 populateDeptFilter();
 updateStats();
 renderGroups();
 } catch(e) {
 const isTimeout = e.message === 'non_json' || e.name === 'TypeError';
 container.innerHTML = `
 <div style="text-align:center;padding:48px 24px;color:var(--text-2);">
 <div style="font-size:36px;margin-bottom:12px;"></div>
 <div style="font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text-1);">
 ${isTimeout ? 'Server is waking up…' : 'Failed to load students'}
 </div>
 <div style="font-size:12px;margin-bottom:20px;">
 ${isTimeout
 ? 'The server may be cold-starting. Wait a moment then retry.'
 : 'Check your connection or try logging out and back in.'}
 </div>
 <button onclick="loadStudents()"
 style="padding:10px 28px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;">
 Retry
 </button>
 </div>`;
 }
}

function populateDeptFilter() {
 const depts = [...new Set(allStudents.map(s => s.department).filter(Boolean))].sort();
 const sel  = document.getElementById('filterDept');
 depts.forEach(d => {
 const o = document.createElement('option');
 o.value = d; o.textContent = d;
 sel.appendChild(o);
 });
}

function updateStats() {
 const captured = allStudents.filter(s => s.capture_locked).length;
 document.getElementById('statTotal').textContent  = allStudents.length;
 document.getElementById('statCaptured').textContent = captured;
 document.getElementById('statPending').textContent  = allStudents.length - captured;
}

// ── Render groups ──────────────────────────────────────────────
function renderGroups() {
 const search = document.getElementById('searchInput').value.trim().toLowerCase();
 const dept  = document.getElementById('filterDept').value;
 const status = document.getElementById('filterStatus').value;

 let filtered = allStudents.filter(s => {
 if (search && !s.name.toLowerCase().includes(search) && !s.matric.toLowerCase().includes(search)) return false;
 if (dept  && s.department !== dept)  return false;
 if (status === 'captured' && !s.capture_locked) return false;
 if (status === 'pending'  &&  s.capture_locked) return false;
 return true;
 });

 // Group by dept + level: "CHEW 100 LEVEL"
 const groups = {};
 filtered.forEach(s => {
 const key = `${s.department} ${s.level} LEVEL`;
 if (!groups[key]) groups[key] = { students: [], captured: 0 };
 groups[key].students.push(s);
 if (s.capture_locked) groups[key].captured++;
 });

 const sortedKeys = Object.keys(groups).sort();

 if (!sortedKeys.length) {
 document.getElementById('groupsContainer').innerHTML =
 '<div style="text-align:center;padding:40px;color:var(--text-2);">No students match your filter.</div>';
 return;
 }

 document.getElementById('groupsContainer').innerHTML = sortedKeys.map(key => {
 const g = groups[key];
 const pending = g.students.length - g.captured;
 return `
 <div class="group-header">
 <span> ${escHtml(key)}</span>
 <div class="group-count">
 <span class="cap-count"> ${g.captured} captured</span>
 <span>· <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> ${pending} pending</span>
 </div>
 </div>
 ${g.students.length ? `
 <div class="student-grid">
 ${g.students.map(s => studentCard(s)).join('')}
 </div>` : `<div class="group-empty">No students in this group.</div>`}
 `;
 }).join('');
}

function studentCard(s) {
 const initials = s.name.split(' ').map(w => w[0] || '').slice(0, 2).join('').toUpperCase();
 const hasPic  = !!s.profile_photo_url;
 const cls  = hasPic ? 'captured' : 'no-photo';
 const avatar  = hasPic
 ? `<img class="s-photo" src="${escHtml(s.profile_photo_url)}" alt="${escHtml(s.name)}" loading="lazy">`
 : `<div class="s-initials">${escHtml(initials)}</div>`;
 const statusBadge = hasPic
 ? `<div class="s-status captured" title="Captured"></div>`
 : `<div class="s-status pending"  title="Pending">!</div>`;
 return `
 <div class="student-card ${cls}" id="sc_${s.id}">
 ${statusBadge}
 ${avatar}
 <div class="s-name">${escHtml(s.name)}</div>
 <div class="s-matric">${escHtml(s.matric)}</div>
 ${hasPic ? `<button class="s-reset-btn" onclick="resetCapture('${s.id}','${escHtml(s.name)}')">Reset</button>` : ''}
 </div>`;
}

// ── Reset a student's capture ──────────────────────────────────
async function resetCapture(studentId, name) {
 const _ok = await showConfirm({ type:'warn', title:'Reset Face Capture?', msg:`The photo for <strong>${name}</strong> will be deleted and they will be allowed to re-capture.`, okLabel:'Reset' });
    if (!_ok) return;
 try {
 const data = await apiPost('/api/admin/student/reset-capture', { student_id: studentId });
 if (data.success) {
 showAlert(` Capture reset for <strong>${escHtml(name)}</strong>.`, 'success');
 await loadStudents();
 } else {
 showAlert(' ' + (data.message || 'Reset failed.'), 'danger');
 }
 } catch(e) { showAlert(' Server error.', 'danger'); }
}

// ── EXPORT HELPERS ───────────────────────────────────────────────────
function getExportData() {
 const search = document.getElementById('searchInput').value.trim().toLowerCase();
 const dept  = document.getElementById('filterDept').value;
 const status = document.getElementById('filterStatus').value;
 return allStudents.filter(s => {
 if (search && !s.name.toLowerCase().includes(search) && !s.matric.toLowerCase().includes(search)) return false;
 if (dept  && s.department !== dept)  return false;
 if (status === 'captured' && !s.capture_locked) return false;
 if (status === 'pending'  &&  s.capture_locked) return false;
 return true;
 });
}

function getExportLabels() {
 const deptSel  = document.getElementById('filterDept');
 const statusSel = document.getElementById('filterStatus');
 const deptLabel  = deptSel.value
 ? deptSel.options[deptSel.selectedIndex].text.toUpperCase()
 : 'ALL DEPARTMENTS';
 const statusLabel = statusSel.value === 'captured' ? 'CAPTURED STUDENTS'
 : statusSel.value === 'pending' ? 'PENDING CAPTURE'
 : 'ALL STUDENTS';
 return { deptLabel, statusLabel };
}

// ── EXCEL EXPORT ─────────────────────────────────────────────────────
function exportProfilesExcel() {
 const data = getExportData();
 if (!data.length) { alert('No students to export with current filter.'); return; }

 const { deptLabel, statusLabel } = getExportLabels();
 const statusEmoji = statusLabel.includes('CAPTURED') ? ' ' : statusLabel.includes('PENDING') ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> ' : '';

 const wsData = [
 ['MARGMOCOTH CBT'],
 ['FACE CAPTURE REPORT — ' + statusEmoji + statusLabel],
 [deptLabel],
 ['Generated: ' + new Date().toLocaleString('en-NG')],
 [],
 ['S/N', 'NAME', 'MATRIC NO', 'DEPARTMENT', 'LEVEL', 'CAPTURE STATUS']
 ];

 data.forEach((s, i) => {
 wsData.push([
 i + 1,
 s.name,
 s.matric,
 s.department || '—',
 s.level ? s.level + ' Level' : '—',
 s.capture_locked ? ' Captured' : '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> Pending'
 ]);
 });

 const wb = XLSX.utils.book_new();
 const ws = XLSX.utils.aoa_to_sheet(wsData);
 ws['!cols'] = [{ wch: 5 }, { wch: 32 }, { wch: 20 }, { wch: 28 }, { wch: 12 }, { wch: 16 }];
 ws['!merges'] = [
 { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
 { s: { r: 1, c: 0 }, e: { r: 1, c: 5 } },
 { s: { r: 2, c: 0 }, e: { r: 2, c: 5 } },
 { s: { r: 3, c: 0 }, e: { r: 3, c: 5 } }
 ];
 XLSX.utils.book_append_sheet(wb, ws, 'Capture Report');
 const fn = `MARGMOCOTH CBT_CaptureReport_${deptLabel.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
 XLSX.writeFile(wb, fn);
}

// ── PDF EXPORT ──────────────────────────────────────────────────────
function exportProfilesPDF() {
 const data = getExportData();
 if (!data.length) { alert('No students to export with current filter.'); return; }

 const { deptLabel, statusLabel } = getExportLabels();
 const isCaptured = statusLabel.includes('CAPTURED');
 const isPending  = statusLabel.includes('PENDING');
 const isAllDepts = deptLabel === 'ALL DEPARTMENTS';

 // Header colour: green for captured, amber for pending, blue for all
 const hColor  = isCaptured ? [15, 107, 48] : isPending ? [146, 64, 14] : [30, 58, 138];
 const hColorDark = isCaptured ? [10, 80, 35]  : isPending ? [110, 48, 10] : [20, 40, 120];

 const { jsPDF } = window.jspdf;
 const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

 // ── Draw page header band ─────────────────────────────────────────
 function drawPageHeader(doc) {
 doc.setFillColor(...hColor);
 doc.rect(0, 0, 210, 38, 'F');
 doc.setTextColor(255, 255, 255);
 doc.setFont('helvetica', 'bold');
 doc.setFontSize(12);
 doc.text('MARGMOCOTH CBT', 105, 10, { align: 'center' });
 doc.setFontSize(9);
 doc.text('FACE CAPTURE REPORT — ' + statusLabel, 105, 19, { align: 'center' });
 doc.setFontSize(8);
 doc.setFont('helvetica', 'normal');
 doc.text(deptLabel, 105, 27, { align: 'center' });
 doc.text('Generated: ' + new Date().toLocaleString('en-NG'), 105, 34, { align: 'center' });
 }

 drawPageHeader(doc);

 // ── Table column config ───────────────────────────────────────────
 const colStyles = {
 0: { halign: 'center', cellWidth: 11 },
 2: { halign: 'center', cellWidth: 32 },
 4: { halign: 'center', cellWidth: 18 },
 5: { halign: 'center', cellWidth: 22, fontStyle: 'bold' }
 };

 const tableBaseOpts = {
 theme: 'grid',
 headStyles:  { fillColor: hColor, textColor: [255,255,255], fontStyle: 'bold', fontSize: 8 },
 bodyStyles:  { fontSize: 8, cellPadding: 2.5, textColor: [30, 30, 30] },
 alternateRowStyles:  { fillColor: [248, 250, 252] },
 columnStyles:  colStyles,
 // Colour status cell without re-drawing the text
 willDrawCell(d) {
 if (d.section === 'body' && d.column.index === 5) {
 const val = d.cell.raw;
 d.cell.styles.textColor = val === 'Captured' ? [22, 101, 52] : [146, 64, 14];
 }
 },
 didAddPage(data) {
 // Reprint the header band on every new page
 drawPageHeader(doc);
 data.settings.startY = 43;
 }
 };

 const FOOT = [[{
 content: 'Powered by Tribal Tech',
 colSpan: 6,
 styles: { halign: 'center', fontSize: 7, textColor: [100,100,100] }
 }]];

 if (!isAllDepts) {
 // ── Single dept: one flat table ─────────────────────────────────
 const body = data.map((s, i) => [
 i + 1,
 s.name,
 s.matric,
 s.department || '—',
 s.level ? s.level + ' Lvl' : '—',
 s.capture_locked ? 'Captured' : 'Pending'
 ]);

 doc.autoTable({
 ...tableBaseOpts,
 head: [['S/N', 'NAME', 'MATRIC NO', 'DEPARTMENT', 'LEVEL', 'STATUS']],
 body,
 startY: 43,
 foot: FOOT,
 footStyles: { fillColor: [248, 250, 252] }
 });

 } else {
 // ── All departments: group by DEPT » LEVEL ──────────────────────
 const groups = {};
 data.forEach(s => {
 const key = `${s.department || '—'} » ${s.level ? s.level + ' Level' : '—'}`;
 if (!groups[key]) groups[key] = [];
 groups[key].push(s);
 });
 const sortedKeys = Object.keys(groups).sort();
 let currentY = 43;
 let globalSN = 1; // serial number runs across all groups

 sortedKeys.forEach((groupKey, gIdx) => {
 const students = groups[groupKey];
 const isLast  = gIdx === sortedKeys.length - 1;

 // Group section header row (spans full width, dark bg)
 const sectionHead = [[{
 content: '  ' + groupKey.toUpperCase() + '  —  ' + students.length + ' student(s)',
 colSpan: 6,
 styles: {
 fillColor: hColorDark,
 textColor: [255, 255, 255],
 fontStyle: 'bold',
 fontSize: 8.5,
 cellPadding: { top: 4, bottom: 4, left: 6, right: 6 }
 }
 }]];

 const body = students.map(s => [
 globalSN++,
 s.name,
 s.matric,
 s.department || '—',
 s.level ? s.level + ' Lvl' : '—',
 s.capture_locked ? 'Captured' : 'Pending'
 ]);

 doc.autoTable({
 ...tableBaseOpts,
 head: [
 // Section title row
 [{ content: '  ' + groupKey.toUpperCase() + '  —  ' + students.length + ' student(s)',
 colSpan: 6,
 styles: {
 fillColor: hColorDark, textColor: [255,255,255], fontStyle: 'bold',
 fontSize: 8.5, cellPadding: { top: 4, bottom: 4, left: 6, right: 6 }
 }
 }],
 // Column headers
 ['S/N', 'NAME', 'MATRIC NO', 'DEPARTMENT', 'LEVEL', 'STATUS']
 ],
 body,
 startY: currentY,
 // Only add footer on the very last group
 ...(isLast ? { foot: FOOT, footStyles: { fillColor: [248, 250, 252] } } : {}),
 margin: { top: 43 }  // so didAddPage starts below header band
 });

 currentY = doc.lastAutoTable.finalY + 6;
 });
 }

 const fn = `MARGMOCOTH CBT_CaptureReport_${deptLabel.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`;
 doc.save(fn);
}

function escHtml(s) {
 return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────
loadPage();

// ── DEPARTMENT EXPORT MODAL ───────────────────────────────────
let deptExportStatus = ''; // '', 'captured', 'pending'

function openDeptExportModal() {
 // Populate dept dropdown from allStudents
 const sel = document.getElementById('deptExportSelect');
 // Clear existing options except first
 while (sel.options.length > 1) sel.remove(1);
 const depts = [...new Set(allStudents.map(s => s.department).filter(Boolean))].sort();
 depts.forEach(d => {
 const opt = document.createElement('option');
 opt.value = d; opt.textContent = d;
 sel.appendChild(opt);
 });
 deptExportStatus = '';
 ['dsbAll','dsbCaptured','dsbPending'].forEach(id =>
 document.getElementById(id).classList.remove('active'));
 document.getElementById('dsbAll').classList.add('active');
 updateDeptExportPreview();
 const modal = document.getElementById('deptExportModal');
 modal.style.display = 'flex';
 document.body.style.overflow = 'hidden';
}

function closeDeptExportModal() {
 document.getElementById('deptExportModal').style.display = 'none';
 document.body.style.overflow = '';
}

function setDeptStatus(val) {
 deptExportStatus = val;
 document.getElementById('dsbAll').classList.toggle('active',  val === '');
 document.getElementById('dsbCaptured').classList.toggle('active', val === 'captured');
 document.getElementById('dsbPending').classList.toggle('active',  val === 'pending');
 updateDeptExportPreview();
}

function getDeptExportData() {
 const dept = document.getElementById('deptExportSelect').value;
 return allStudents.filter(s => {
 if (dept && s.department !== dept) return false;
 if (deptExportStatus === 'captured' && !s.capture_locked)  return false;
 if (deptExportStatus === 'pending'  &&  s.capture_locked)  return false;
 return true;
 });
}

function updateDeptExportPreview() {
 const data  = getDeptExportData();
 const dept  = document.getElementById('deptExportSelect').value;
 const cap  = data.filter(s => s.capture_locked).length;
 const pending = data.length - cap;
 const prev  = document.getElementById('deptExportPreview');
 if (!data.length) {
 prev.textContent = 'No students match this selection.';
 prev.style.background = '#fff7ed';
 return;
 }
 prev.style.background = '#f1f2fa';
 prev.innerHTML =
 `<strong>${data.length}</strong> student${data.length!==1?'s':''} in ` +
 `<strong>${dept || 'All Departments'}</strong>` +
 ` &nbsp;·&nbsp;  ${cap} captured &nbsp;·&nbsp; <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> ${pending} pending`;
}

function runDeptExport(type) {
 const data = getDeptExportData();
 if (!data.length) { alert('No students match this selection.'); return; }

 const dept  = document.getElementById('deptExportSelect').value;
 const deptLabel  = dept ? dept.toUpperCase() : 'ALL DEPARTMENTS';
 const statusLabel = deptExportStatus === 'captured' ? 'CAPTURED STUDENTS'
 : deptExportStatus === 'pending' ? 'PENDING CAPTURE' : 'ALL STUDENTS';

 if (type === 'excel') {
 _deptExcel(data, deptLabel, statusLabel);
 } else {
 _deptPDF(data, deptLabel, statusLabel);
 }
}

function _deptExcel(data, deptLabel, statusLabel) {
 const wsData = [
 ['MARGMOCOTH CBT'],
 ['FACE CAPTURE REPORT — ' + statusLabel],
 [deptLabel],
 ['Generated: ' + new Date().toLocaleString('en-NG')],
 [],
 ['S/N', 'NAME', 'MATRIC NO', 'DEPARTMENT', 'LEVEL', 'CAPTURE STATUS']
 ];
 data.forEach((s, i) => wsData.push([
 i + 1, s.name, s.matric,
 s.department || '—',
 s.level ? s.level + ' Level' : '—',
 s.capture_locked ? ' Captured' : '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> Pending'
 ]));

 const wb = XLSX.utils.book_new();
 const ws = XLSX.utils.aoa_to_sheet(wsData);
 ws['!cols'] = [{wch:5},{wch:32},{wch:20},{wch:28},{wch:12},{wch:16}];
 ws['!merges'] = [
 {s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}},
 {s:{r:2,c:0},e:{r:2,c:5}},{s:{r:3,c:0},e:{r:3,c:5}}
 ];
 XLSX.utils.book_append_sheet(wb, ws, 'Capture Report');
 const fn = `MARGMOCOTH CBT_${deptLabel.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
 XLSX.writeFile(wb, fn);
 closeDeptExportModal();
}

function _deptPDF(data, deptLabel, statusLabel) {
 const isCaptured = statusLabel.includes('CAPTURED');
 const isPending  = statusLabel.includes('PENDING');
 const hColor  = isCaptured ? [15,107,48] : isPending ? [146,64,14] : [88,28,135];

 const { jsPDF } = window.jspdf;
 const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

 function drawHeader() {
 doc.setFillColor(...hColor);
 doc.rect(0, 0, 210, 38, 'F');
 doc.setTextColor(255,255,255);
 doc.setFont('helvetica','bold'); doc.setFontSize(12);
 doc.text('MARGMOCOTH CBT', 105, 10, {align:'center'});
 doc.setFontSize(9);
 doc.text('FACE CAPTURE REPORT — ' + statusLabel, 105, 19, {align:'center'});
 doc.setFontSize(8); doc.setFont('helvetica','normal');
 doc.text(deptLabel, 105, 27, {align:'center'});
 doc.text('Generated: ' + new Date().toLocaleString('en-NG'), 105, 34, {align:'center'});
 }
 drawHeader();

 // Group by dept » level for "All Departments" export; flat for single dept
 const isAllDepts = deptLabel === 'ALL DEPARTMENTS';
 const colStyles = {
 0:{halign:'center',cellWidth:11},
 2:{halign:'center',cellWidth:32},
 4:{halign:'center',cellWidth:18},
 5:{halign:'center',cellWidth:22,fontStyle:'bold'}
 };
 const tableOpts = {
 theme:'grid',
 headStyles:  {fillColor:hColor,textColor:[255,255,255],fontStyle:'bold',fontSize:8},
 bodyStyles:  {fontSize:8,cellPadding:2.5,textColor:[30,30,30]},
 alternateRowStyles: {fillColor:[248,250,252]},
 columnStyles:  colStyles,
 willDrawCell(d) {
 if (d.section==='body' && d.column.index===5) {
 d.cell.styles.textColor = d.cell.raw==='Captured' ? [22,101,52] : [146,64,14];
 }
 },
 didAddPage(d) { drawHeader(); d.settings.startY = 43; }
 };
 const FOOT = [[{
 content:'Powered by Tribal Tech',
 colSpan:6, styles:{halign:'center',fontSize:7,textColor:[100,100,100]}
 }]];

 if (!isAllDepts) {
 doc.autoTable({
 ...tableOpts,
 head:[['S/N','NAME','MATRIC NO','DEPARTMENT','LEVEL','STATUS']],
 body: data.map((s,i) => [i+1, s.name, s.matric, s.department||'—', s.level?s.level+' Lvl':'—', s.capture_locked?'Captured':'Pending']),
 startY:43, foot:FOOT, footStyles:{fillColor:[248,250,252]}
 });
 } else {
 const groups = {};
 data.forEach(s => {
 const key = `${s.department||'—'} » ${s.level?s.level+' Level':'—'}`;
 if (!groups[key]) groups[key] = [];
 groups[key].push(s);
 });
 let y = 43; let sn = 1;
 Object.keys(groups).sort().forEach((gk, gi, arr) => {
 const students = groups[gk];
 const isLast  = gi === arr.length - 1;
 const secHead  = [[{content:'  '+gk.toUpperCase()+'  —  '+students.length+' student(s)',
 colSpan:6, styles:{fillColor:hColor,textColor:[255,255,255],fontStyle:'bold',fontSize:8,halign:'center'}}]];
 const body = students.map(s => [sn++, s.name, s.matric, s.department||'—', s.level?s.level+' Lvl':'—', s.capture_locked?'Captured':'Pending']);
 doc.autoTable({
 ...tableOpts,
 head:secHead,
 body,
 startY:y,
 ...(isLast ? {foot:FOOT,footStyles:{fillColor:[248,250,252]}} : {})
 });
 y = doc.lastAutoTable.finalY + 6;
 });
 }

 const fn = `MARGMOCOTH CBT_${deptLabel.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`;
 doc.save(fn);
 closeDeptExportModal();
}

</script>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon-wrap" id="confirmIconWrap">
      <svg id="confirmIconSVG" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
           width="26" height="26"></svg>
    </div>
    <div class="confirm-title" id="confirmTitle"></div>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="confirm-btn-cancel" onclick="_confirmResolve(false)">Cancel</button>
      <button class="confirm-btn-ok" id="confirmOkBtn" onclick="_confirmResolve(true)">Confirm</button>
    </div>
  </div>
</div>
<script>
const _CSVG = {
  warn:   '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  danger: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>',
  info:   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
};
let __confirmCb = null;
function showConfirm({ type='warn', title, msg, okLabel='Confirm' }) {
  document.getElementById('confirmIconWrap').className = 'confirm-icon-wrap ' + type;
  document.getElementById('confirmIconSVG').innerHTML = _CSVG[type] || _CSVG.warn;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').innerHTML = msg;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = okLabel;
  okBtn.className = 'confirm-btn-ok ' + type;
  document.getElementById('confirmModal').classList.add('show');
  return new Promise(res => { __confirmCb = res; });
}
function _confirmResolve(val) {
  document.getElementById('confirmModal').classList.remove('show');
  if (__confirmCb) { __confirmCb(val); __confirmCb = null; }
}
document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) _confirmResolve(false);
});
</script>
