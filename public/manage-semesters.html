<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARGMOCOTH CBT">
<meta name="theme-color" content="#2e3192">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semesters – MARGMOCOTH CBT</title>
<link rel="stylesheet" href="css/style.css">
<style>
.sem-toggle-row { display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px; }
.sem-toggle-btn {
 flex:1;min-width:140px;border:2.5px solid #e6e8f3;border-radius:16px;
 padding:18px 16px;cursor:pointer;background:#fff;text-align:center;
 transition:all .2s;font-family:'DM Sans',system-ui,sans-serif;position:relative;overflow:hidden;
}
.sem-toggle-btn:hover { border-color:#8e92b3;box-shadow:0 2px 12px rgba(0,0,0,.07); }
.sem-toggle-btn.active {
 border-color:#16a34a;background:linear-gradient(135deg,#f0fdf4,#dcfce7);
 box-shadow:0 4px 18px rgba(22,163,74,.15);
}
.sem-toggle-btn .stb-icon  { font-size:26px;margin-bottom:8px; }
.sem-toggle-btn .stb-label { font-size:13px;font-weight:800;color:#1b1e45;margin-bottom:4px; }
.sem-toggle-btn .stb-session { font-size:11px;color:#8e92b3;font-weight:600; }
.sem-toggle-btn .stb-badge {
 position:absolute;top:10px;right:10px;background:#16a34a;color:#fff;
 border-radius:999px;font-size:10px;font-weight:800;padding:2px 9px;letter-spacing:.3px;
}
.sem-toggle-btn.inactive .stb-label { color:#5b5f80; }
.sem-record {
 display:flex;align-items:center;gap:12px;border:1.5px solid #e6e8f3;
 border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:box-shadow .2s;
}
.sem-record:hover { box-shadow:0 2px 10px rgba(0,0,0,.06); }
.sem-record.is-active { border-color:#16a34a;background:#f0fdf4; }
.sem-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#e6e8f3; }
.sem-dot.on { background:#16a34a;box-shadow:0 0 0 3px #bbf7d0; }
.sem-rec-info { flex:1;min-width:0; }
.sem-rec-name { font-size:13px;font-weight:700;color:#1b1e45; }
.sem-rec-meta { font-size:11px;color:#8e92b3;margin-top:2px; }
.btn-set-active {
 background:#16a34a;color:#fff;border:none;border-radius:8px;padding:5px 13px;
 font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.btn-set-active:hover { background:#15803d; }
.btn-set-active:disabled { background:#86efac;cursor:default; }
.btn-del-s {
 background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:5px 10px;
 font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.active-status-bar {
 background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border-radius:14px;
 padding:14px 20px;display:flex;align-items:center;gap:14px;margin-bottom:22px;
}
.no-active-bar {
 background:#fffbeb;border:1.5px dashed #fbbf24;border-radius:14px;
 padding:14px 20px;color:#92400e;font-size:13px;font-weight:600;
 margin-bottom:22px;display:flex;align-items:center;gap:10px;
}
</style>
</head>
<body>
<div class="admin-layout">
 <div id="sidebarContainer"></div>
 <div class="admin-main">
 <div id="topbarContainer"></div>
 <div class="content">
 <div id="alertBox"></div>
 <div id="statusBar"></div>

 <div class="card" style="margin-bottom:22px;">
 <div class="card-header">Quick Toggle — Set Active Semester</div>
 <div class="card-body">
 <p style="font-size:13px;color:#5b5f80;margin-bottom:16px;">Tap any semester card to activate it. All new exams will be tagged to whichever is active. Only one can be active at a time.</p>
 <div class="sem-toggle-row" id="toggleRow">
 <div style="color:#8e92b3;font-size:13px;">Loading…</div>
 </div>
 </div>
 </div>

 <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
 <div class="card">
 <div class="card-header">Create New Semester</div>
 <div class="card-body">
 <div class="form-group">
 <label class="form-label">Semester Name *</label>
 <input type="text" id="semName" class="form-control" placeholder="e.g. First Semester Examination">
 </div>
 <div class="form-group">
 <label class="form-label">Academic Session *</label>
 <input type="text" id="semSession" class="form-control" placeholder="e.g. 2024/2025">
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
 <button onclick="document.getElementById('semSession').value='2023/2024'" class="btn btn-ghost btn-sm">2023/2024</button>
 <button onclick="document.getElementById('semSession').value='2024/2025'" class="btn btn-ghost btn-sm">2024/2025</button>
 <button onclick="document.getElementById('semSession').value='2025/2026'" class="btn btn-ghost btn-sm">2025/2026</button>
 </div>
 </div>
 <div class="form-group">
 <label class="form-label">Type</label>
 <select id="semType" class="form-control form-select">
 <option value="first">First Semester</option>
 <option value="second">Second Semester</option>
 <option value="third">Third Semester / Harmattan</option>
 </select>
 </div>
 <label class="form-check" style="margin-bottom:18px;">
 <input type="checkbox" id="semSetActive">Activate immediately after creating
 </label>
 <button onclick="addSemester()" class="btn btn-primary">Create Semester</button>
 </div>
 </div>

 <div class="card">
 <div class="card-header">All Semester Records</div>
 <div class="card-body" id="semList">
 <div style="color:#8e92b3;font-size:13px;text-align:center;padding:24px;">Loading…</div>
 </div>
 </div>
 </div>
 </div>
 </div>
</div>

<script src="js/admin.js"></script>
<script>
document.getElementById('sidebarContainer').innerHTML = getSidebarHTML('manage-semesters.html');
document.getElementById('topbarContainer').innerHTML  = getTopbarHTML('Semesters');
checkAdmin();
requirePermission('manage_config');

const TYPE_LABEL = { first:'First Semester', second:'Second Semester', third:'Third Semester' };
const TYPE_ICON  = { first:'1⃣', second:'2⃣', third:'3⃣' };
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load() {
 const data = await apiGet('/api/semesters');
 const active = data.find(s => s.is_active);

 document.getElementById('statusBar').innerHTML = active
 ? `<div class="active-status-bar">
 <span style="font-size:26px;"></span>
 <div>
 <div style="font-size:11px;font-weight:700;opacity:.8;letter-spacing:.5px;text-transform:uppercase;">Active Semester</div>
 <div style="font-size:17px;font-weight:800;">${esc(active.name)}</div>
 <div style="font-size:12px;opacity:.75;">Session: ${esc(active.session)} · ${TYPE_LABEL[active.type]||active.type}</div>
 </div>
 </div>`
 : `<div class="no-active-bar">No semester is currently active. New exams won't be tagged until you activate one.</div>`;

 const toggleRow = document.getElementById('toggleRow');
 if (!data.length) {
 toggleRow.innerHTML = '<div style="color:#8e92b3;font-size:13px;">No semesters yet. Create one below.</div>';
 } else {
 toggleRow.innerHTML = data.map(s => `
 <div class="sem-toggle-btn ${s.is_active ? 'active' : 'inactive'}"
 onclick="${s.is_active ? '' : `activateSemester('${s.id}')`}"
 style="${s.is_active ? 'cursor:default;' : ''}">
 ${s.is_active ? '<div class="stb-badge">ACTIVE</div>' : ''}
 <div class="stb-icon">${TYPE_ICON[s.type]||''}</div>
 <div class="stb-label">${esc(s.name)}</div>
 <div class="stb-session">${esc(s.session)}</div>
 </div>`).join('');
 }

 const list = document.getElementById('semList');
 if (!data.length) {
 list.innerHTML = '<div style="color:#8e92b3;font-size:13px;text-align:center;padding:24px;">No records yet.</div>';
 return;
 }
 list.innerHTML = data.map(s => `
 <div class="sem-record ${s.is_active ? 'is-active' : ''}">
 <div class="sem-dot ${s.is_active ? 'on' : ''}"></div>
 <div class="sem-rec-info">
 <div class="sem-rec-name">${esc(s.name)}</div>
 <div class="sem-rec-meta">${esc(s.session)} · ${TYPE_LABEL[s.type]||s.type}</div>
 </div>
 ${s.is_active
 ? `<button class="btn-set-active" disabled>Active</button>`
 : `<button class="btn-set-active" onclick="activateSemester('${s.id}')">▶ Activate</button>`}
 <button class="btn-del-s" onclick="deleteSemester('${s.id}',${s.is_active})"></button>
 </div>`).join('');
}

async function activateSemester(id) {
 const r = await apiPut(`/api/admin/semesters/${id}/activate`, {});
 if (r.success) { showAlert(' Semester activated! All new exams will be tagged to it.', 'success'); load(); }
 else showAlert(r.message || 'Failed.', 'danger');
}

async function addSemester() {
 const name  = document.getElementById('semName').value.trim();
 const session  = document.getElementById('semSession').value.trim();
 const type  = document.getElementById('semType').value;
 const set_active = document.getElementById('semSetActive').checked;
 if (!name || !session) { showAlert('Name and session are required.', 'danger'); return; }
 const btn = document.querySelector('button[onclick="addSemester()"]');
 btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg> Creating…'; btn.disabled = true;
 const r = await apiPost('/api/admin/semesters', { name, session, type, set_active });
 btn.innerHTML = ' Create Semester'; btn.disabled = false;
 if (r.success) {
 showAlert('Semester created!', 'success');
 document.getElementById('semName').value = '';
 document.getElementById('semSession').value = '';
 document.getElementById('semSetActive').checked = false;
 load();
 } else showAlert(r.message, 'danger');
}

async function deleteSemester(id, isActive) {
 if (isActive) { showAlert('Cannot delete the active semester. Activate another first.', 'danger'); return; }
 if (!confirmDelete('Delete this semester?')) return;
 const r = await apiDelete(`/api/admin/semesters/${id}`);
 if (r.success) { showAlert('Deleted.', 'success'); load(); }
 else showAlert(r.message, 'danger');
}

load();
</script>
<script src="js/ai-assistant.js" defer></script>
<script src="/pwa.js"></script>
</body>
</html>
