<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARGMOCOTH CBT">
<meta name="theme-color" content="#2e3192">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MARGMOCOTH CBT</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Admin login uses page-bg from style.css + login-card ── */
body { padding: 0; background: none; }
.page-bg { padding-bottom: 80px; }

.login-card-header .admin-badge {
  width: 72px; height: 72px;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(251,191,36,0.5);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  animation: badgePulse 2.5s ease infinite;
}
@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.4); }
  50%      { box-shadow: 0 0 0 12px rgba(251,191,36,0); }
}

.security-note {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--brand-50);
  border: 1px solid var(--brand-400);
  border-left: 3px solid var(--brand-600);
  border-radius: var(--r-sm);
  padding: 11px 14px;
  font-size: 12.5px; font-weight: 500;
  color: var(--brand-800);
  margin-bottom: 20px;
  line-height: 1.5;
}
.security-note svg { flex-shrink: 0; margin-top: 1px; }

.password-wrap { position: relative; }
.password-wrap .form-control { padding-right: 46px; }
.toggle-pw {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--text-3); padding: 4px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: color var(--dur);
}
.toggle-pw:hover { color: var(--brand-600); }

.admin-role-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--r-pill);
  padding: 3px 12px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.8px; text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="page-bg">
  <div class="login-card">
    <div class="login-card-header">
      <div class="admin-role-tag">
        <svg viewBox="0 0 12 12" fill="none" width="10" height="10">
          <circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="6" r="1.5" fill="currentColor"/>
        </svg>
        Admin Portal
      </div>
      <div class="admin-badge">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36">
          <path d="M20 4L6 10v9c0 8.28 5.92 16.04 14 18 8.08-1.96 14-9.72 14-18V10L20 4z"
            fill="rgba(255,255,255,0.18)" stroke="rgba(251,191,36,0.7)"
            stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M14 20l4 4 8-8" stroke="#fbbf24" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>MARGMOCOTH CBT</h1>
      <p>Director &amp; Lecturer Sign-In</p>
    </div>

    <div class="login-card-body">
      <div class="security-note">
        <svg viewBox="0 0 16 16" fill="none" width="15" height="15">
          <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
        </svg>
        Restricted access. Unauthorized use is strictly prohibited.
      </div>

      <div id="alertBox"></div>

      <div class="form-group">
        <label class="form-label">Administrator Email</label>
        <input type="email" id="username" class="form-control"
          placeholder="Enter admin email" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-control"
            placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="toggle-pw" id="eyeBtn"
            onclick="togglePasswordVisibility()" title="Show/hide password">
            <svg id="eyeIcon" viewBox="0 0 16 16" fill="none" width="18" height="18">
              <path d="M1 8C2.5 5 5 3.5 8 3.5S13.5 5 15 8c-1.5 3-4 4.5-7 4.5S2.5 11 1 8z"
                stroke="currentColor" stroke-width="1.4"/>
              <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </div>
      </div>

      <button onclick="adminLogin()" id="loginBtn" class="btn btn-primary btn-full btn-lg" style="margin-top:6px;">
        Sign In to Dashboard
      </button>
    </div>
  </div>
</div>

<footer class="footer-marquee">
  <div class="marquee-content">
    <span>Powered by Tribal Tech &nbsp;&#183;&nbsp; MARGMOCOTH Admin Portal &nbsp;&#183;&nbsp; Powered by Tribal Tech &nbsp;&#183;&nbsp; MARGMOCOTH Admin Portal &nbsp;&#183;&nbsp; Powered by Tribal Tech &nbsp;&#183;&nbsp; MARGMOCOTH Admin Portal</span>
  </div>
</footer>

<script>
let pwVisible = false;

function togglePasswordVisibility() {
  pwVisible = !pwVisible;
  const input = document.getElementById('password');
  const icon  = document.getElementById('eyeIcon');
  input.type  = pwVisible ? 'text' : 'password';
  // toggle slash line
  const slash = icon.querySelector('.slash-line');
  if (pwVisible) {
    if (!slash) {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1','3'); line.setAttribute('y1','3');
      line.setAttribute('x2','13'); line.setAttribute('y2','13');
      line.setAttribute('stroke','currentColor'); line.setAttribute('stroke-width','1.4');
      line.setAttribute('stroke-linecap','round'); line.classList.add('slash-line');
      icon.appendChild(line);
    }
  } else {
    if (slash) slash.remove();
  }
}

async function adminLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';

  if (!username || !password) {
    alertBox.innerHTML = '<div class="alert alert-warning">Please enter your email and password.</div>';
    return;
  }

  const btn = document.getElementById('loginBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Signing in…';
  btn.disabled = true;

  try {
    const res  = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.success) {
      alertBox.innerHTML = '<div class="alert alert-success">Login successful — redirecting…</div>';
      sessionStorage.setItem('admin', JSON.stringify(data.admin));
      sessionStorage.setItem('adminToken', data.token);
      setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
      btn.innerHTML = originalText;
      btn.disabled  = false;
    }
  } catch (e) {
    alertBox.innerHTML = '<div class="alert alert-danger">Server error. Please try again.</div>';
    btn.innerHTML = originalText;
    btn.disabled  = false;
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
</script>
<script src="/pwa.js"></script>
</body>
</html>
